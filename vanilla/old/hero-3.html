<!DOCTYPE html>
<html class="dark" lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Refined IT Hero Section</title>
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&amp;display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&amp;display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              // Extracted from CI Logo
              primary: "#0bbdb4", // Cyan/Teal from logo
              "primary-dark": "#0a9c94",
              secondary: "#213b8a", // Deep Blue from logo
              "secondary-light": "#2f4fb3",
              "background-light": "#ffffff",
              "background-dark": "#0f172a", // Darker slate for contrast if needed, but we are aiming lighter overall
              "surface-light": "#f8fafc",
              "text-main": "#1e293b",
              "text-sub": "#64748b",
            },
            fontFamily: {
              display: ["Space Grotesk", "sans-serif"],
              body: ["Noto Sans KR", "sans-serif"],
            },
            borderRadius: {
              DEFAULT: "0.25rem",
              lg: "0.5rem",
              xl: "0.75rem",
              "2xl": "1rem",
              full: "9999px",
            },
            backgroundImage: {
              "grid-pattern":
                "linear-gradient(to right, #e2e8f0 1px, transparent 1px), linear-gradient(to bottom, #e2e8f0 1px, transparent 1px)",
            },
            animation: {
              "spin-slow": "spin 60s linear infinite",
              float: "float 6s ease-in-out infinite",
              "pulse-slow": "pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite",
            },
            keyframes: {
              float: {
                "0%, 100%": { transform: "translateY(0)" },
                "50%": { transform: "translateY(-20px)" },
              },
            },
          },
        },
      };
    </script>
    <style type="text/tailwindcss">
      :root {
        --primary-color: #0bbdb4;
        --secondary-color: #213b8a;
      }
      .text-glow-light {
        text-shadow: 0 0 30px rgba(11, 189, 180, 0.4);
      }
      .bg-grid-mask-light {
        mask-image: radial-gradient(
          circle at center,
          black 40%,
          transparent 80%
        );
        -webkit-mask-image: radial-gradient(
          circle at center,
          black 40%,
          transparent 80%
        );
      }
      .sphere-container {
        perspective: 1000px;
      }
      .sphere-ring {
        transform-style: preserve-3d;
      }
    </style>
  </head>
  <body
    class="bg-background-light font-body text-text-main antialiased overflow-x-hidden selection:bg-primary/20 selection:text-secondary"
  >
    <div class="relative min-h-screen flex flex-col">
      <div class="absolute inset-0 z-0 overflow-hidden pointer-events-none">
        <div
          class="absolute inset-0 bg-gradient-to-b from-surface-light via-white to-white z-0"
        ></div>
        <div
          class="absolute right-[-10%] top-[10%] w-[800px] h-[800px] opacity-20 animate-spin-slow z-0 mix-blend-multiply sphere-container"
        >
          <div
            class="absolute inset-0 rounded-full bg-[url('https://lh3.googleusercontent.com/aida-public/AB6AXuAZLPKwclaY4tbJALch-EQK7hnyXJXcM4p1CXi-yqG_gV5cPfpKIEkCVddVKqj3MbyUX0maGXBN_PyrFrCUW5cEAqgau4K3DagtDyShwyUOAT7GY2x5jt_sDCn9SETO9erDxkEIkDm_bLxjP8638DySMgknni-47Ey6wxbuIkoc4KvzcdyLwxBYy4v6ifWF-ivNP5yVNB_Lcf9FtVUxu9TYH0ITPBwT6bVlLhMTY-ZdjGbwc6-JMzTe0V6FGEMpUN8wOyb5-b4O4Q')] bg-cover bg-center opacity-60"
          ></div>
          <div
            class="absolute inset-[10%] border border-secondary/30 rounded-full"
          ></div>
          <div
            class="absolute inset-[20%] border border-primary/30 rounded-full border-dashed"
          ></div>
          <div
            class="absolute inset-[30%] border border-secondary/20 rounded-full"
          ></div>
        </div>
        <div
          class="absolute inset-0 z-10 opacity-40 bg-grid-pattern bg-[length:40px_40px] bg-grid-mask-light"
        ></div>
        <div
          class="absolute top-[-20%] left-[-10%] w-[800px] h-[800px] bg-primary/10 rounded-full blur-[100px] z-0"
        ></div>
        <div
          class="absolute bottom-[-10%] right-[10%] w-[600px] h-[600px] bg-secondary/5 rounded-full blur-[120px] z-0"
        ></div>
      </div>
      <header
        class="relative z-50 w-full bg-white/50 backdrop-blur-md border-b border-gray-100"
      >
        <div
          class="max-w-6xl mx-auto px-6 h-20 flex items-center justify-between"
        >
          <a class="flex items-center gap-3 group" href="#">
            <div class="relative size-10 flex items-center justify-center">
              <span
                class="material-symbols-outlined !text-[40px] text-secondary absolute left-0 group-hover:scale-105 transition-transform"
                >crop_square</span
              >
              <span
                class="material-symbols-outlined !text-[36px] text-primary absolute left-3 top-1 bg-white rounded-full group-hover:rotate-45 transition-transform duration-500"
                >apps</span
              >
            </div>
            <div class="flex flex-col leading-none">
              <h2
                class="text-secondary text-2xl font-bold tracking-tight font-display"
              >
                THE DAOL
              </h2>
              <span
                class="text-xs text-gray-500 tracking-widest uppercase font-semibold"
                >Systems</span
              >
            </div>
          </a>
          <button
            class="md:hidden text-text-main hover:text-primary transition-colors"
          >
            <span class="material-symbols-outlined">menu</span>
          </button>
        </div>
      </header>
      <main
        class="relative z-40 flex-grow flex items-center px-6 py-20 lg:py-32"
      >
        <div
          class="max-w-7xl mx-auto w-full grid lg:grid-cols-2 gap-12 items-center"
        >
          <div
            class="flex flex-col items-start text-left gap-8 animate-fade-in-up"
          >
            <div class="space-y-4">
              <h1
                class="text-secondary text-5xl lg:text-7xl font-bold leading-[1.1] tracking-tight font-display"
              >
                Smart
                <span
                  class="text-transparent bg-clip-text bg-gradient-to-r from-primary to-secondary"
                  >Innovation</span
                ><br />
                Secure Future.
              </h1>
              <p
                class="text-text-sub text-lg lg:text-xl font-normal leading-relaxed max-w-xl"
              >
                안전하고 신뢰할 수 있는 시스템 통합, 끊김 없는 SM 서비스, 그리고
                혁신적인 AI 기술로 귀사의 비즈니스 미래를 함께 열어갑니다.
              </p>
            </div>
            <div
              class="flex flex-col sm:flex-row items-center gap-4 w-full sm:w-auto pt-4"
            >
              <button
                class="group relative flex items-center justify-center h-14 px-8 w-full sm:w-auto bg-primary hover:bg-primary-dark text-white text-base font-bold rounded-xl transition-all shadow-lg shadow-primary/30 hover:shadow-primary/50 overflow-hidden"
              >
                <span class="relative z-10">프로젝트 문의하기</span>
                <span
                  class="material-symbols-outlined relative z-10 ml-2 text-xl transition-transform group-hover:translate-x-1"
                  >arrow_forward</span
                >
                <div
                  class="absolute inset-0 -translate-x-full group-hover:animate-[shimmer_1.5s_infinite] bg-gradient-to-r from-transparent via-white/30 to-transparent z-0"
                ></div>
              </button>
              <button
                class="group flex items-center justify-center h-14 px-8 w-full sm:w-auto bg-white border border-gray-200 hover:border-secondary hover:text-secondary text-text-sub text-base font-bold rounded-xl transition-all shadow-sm hover:shadow-md"
              >
                <span>회사소개서 다운로드</span>
                <span
                  class="material-symbols-outlined ml-2 text-xl group-hover:animate-bounce"
                  >download</span
                >
              </button>
            </div>
          </div>
          <div class="relative hidden lg:block h-[600px] w-full">
            <div class="absolute inset-0 flex items-center justify-center">
              <div class="relative w-[500px] h-[500px] animate-float">
                <div
                  class="absolute inset-0 bg-gradient-to-tr from-secondary/5 to-primary/5 rounded-full blur-xl transform scale-110"
                ></div>
                <div
                  class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[400px] h-[400px] border-[1px] border-primary/20 rounded-full animate-[spin_20s_linear_infinite]"
                >
                  <div
                    class="absolute top-0 left-1/2 w-2 h-2 bg-primary rounded-full blur-[1px]"
                  ></div>
                  <div
                    class="absolute bottom-0 left-1/2 w-2 h-2 bg-primary rounded-full blur-[1px]"
                  ></div>
                </div>
                <div
                  class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[300px] h-[300px] border-[1px] border-secondary/20 rounded-full animate-[spin_15s_linear_infinite_reverse]"
                >
                  <div
                    class="absolute top-1/2 right-0 w-3 h-3 bg-secondary rounded-full blur-[1px]"
                  ></div>
                </div>
                <div
                  class="absolute inset-0 rounded-full overflow-hidden opacity-90"
                >
                  <div
                    class="absolute inset-0 bg-[url('https://lh3.googleusercontent.com/aida-public/AB6AXuAZLPKwclaY4tbJALch-EQK7hnyXJXcM4p1CXi-yqG_gV5cPfpKIEkCVddVKqj3MbyUX0maGXBN_PyrFrCUW5cEAqgau4K3DagtDyShwyUOAT7GY2x5jt_sDCn9SETO9erDxkEIkDm_bLxjP8638DySMgknni-47Ey6wxbuIkoc4KvzcdyLwxBYy4v6ifWF-ivNP5yVNB_Lcf9FtVUxu9TYH0ITPBwT6bVlLhMTY-ZdjGbwc6-JMzTe0V6FGEMpUN8wOyb5-b4O4Q')] bg-cover bg-center mix-blend-overlay"
                  ></div>
                </div>
                <div
                  class="absolute top-10 right-20 w-32 h-20 bg-white/40 blur-2xl rounded-full transform -rotate-45"
                ></div>
              </div>
            </div>
          </div>
        </div>
      </main>
    </div>
    <script>
      // Simple animation config for tailwind
      tailwind.config.theme.extend.keyframes = {
        ...tailwind.config.theme.extend.keyframes,
        shimmer: {
          "100%": { transform: "translateX(100%)" },
        },
      };
    </script>
  </body>
</html>
